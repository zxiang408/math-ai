name: V0.23 Cloud Archive Regression

on:
  push:
    paths:
      - "src/index.js"
      - "src/cloud-archive.js"
      - "public/index.html"
      - "supabase/**"
      - "tests/v023-cloud-archive.spec.mjs"
      - "tests/v023-ui-sync.spec.mjs"
      - ".github/workflows/v023-cloud-archive.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run worker cloud archive regression
        run: node tests/v023-cloud-archive.spec.mjs

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/math-ai-http.log 2>&1 &
          echo $! > /tmp/math-ai-http.pid

      - name: Run browser sync regression
        env:
          TEST_URL: http://127.0.0.1:4173/index.html
        run: node tests/v023-ui-sync.spec.mjs
